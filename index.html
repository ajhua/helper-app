<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helper — Personal Academic &amp; Productivity Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --accent-text: #4338ca;
    }

    [data-theme="dark"] {
      --bg-app: #0b1120;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1f2937;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --accent-text: #a5b4fc;
    }

    [data-theme="warm"] {
      --bg-app: #faf7f2;
      --bg-surface: #fffdf9;
      --bg-subtle: #f3ede2;
      --text-main: #292524;
      --text-muted: #78716c;
      --border-color: #e7e0d3;
    }

    [data-theme="slate"] {
      --bg-app: #0f172a;
      --bg-surface: #1e293b;
      --bg-subtle: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-text: #7dd3fc;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .surface {
      background-color: var(--bg-surface);
      border-color: var(--border-color);
    }

    .subtle {
      background-color: var(--bg-subtle);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .border-theme {
      border-color: var(--border-color);
    }

    .btn-accent {
      background-color: var(--accent);
      color: #ffffff;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
    }

    .badge-accent {
      background-color: var(--accent-soft);
      color: var(--accent-text);
    }

    .nav-active {
      background-color: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }

    .compact-mode .card-pad {
      padding: 0.75rem !important;
    }
    .compact-mode .section-gap {
      gap: 0.75rem !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
  <!-- Top Header -->
  <header class="surface border-b sticky top-0 z-30 backdrop-blur-md bg-opacity-95">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center gap-2 sm:gap-4">
      <!-- Mobile menu toggle -->
      <button id="mobileMenuBtn" type="button" class="lg:hidden p-2 rounded-lg subtle hover:opacity-80" aria-label="Toggle navigation">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <!-- Brand -->
      <div class="flex items-center gap-2.5 shrink-0 cursor-pointer" id="brandHomeBtn">
        <div class="w-9 h-9 rounded-xl btn-accent flex items-center justify-center shadow-sm">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div class="hidden sm:block">
          <div id="appTitleDisplay" class="font-bold text-base leading-tight tracking-tight">Helper</div>
          <div id="appSubtitleDisplay" class="text-xs text-muted leading-tight">Fall Semester • Student Hub</div>
        </div>
      </div>

      <!-- Global Search Bar -->
      <div class="flex-1 max-w-2xl relative">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-muted absolute left-3 pointer-events-none"></i>
          <input
            id="globalSearchInput"
            type="text"
            autocomplete="off"
            placeholder="Search tasks, timetable, notes, books, syllabus, tut sheets, links..."
            class="w-full pl-9 pr-16 py-2 text-sm rounded-xl border border-theme subtle focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition"
          />
          <div class="absolute right-2.5 flex items-center gap-1">
            <button id="clearSearchBtn" type="button" class="hidden p-1 rounded hover:bg-black/10 text-muted" aria-label="Clear search">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
            <kbd class="hidden md:inline-block px-1.5 py-0.5 text-[10px] font-medium text-muted surface border border-theme rounded">/</kbd>
          </div>
        </div>
        <!-- Instant Search Dropdown -->
        <div id="searchDropdown" class="hidden absolute left-0 right-0 mt-1.5 surface border border-theme rounded-xl shadow-xl z-50 max-h-[70vh] overflow-y-auto p-2"></div>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="quickAddBtn" type="button" class="btn-accent px-3 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden md:inline">Quick Add</span>
        </button>
        <button id="customizeBtn" type="button" class="p-2 rounded-xl surface border border-theme hover:opacity-80 transition flex items-center gap-1.5 text-sm" title="Customize Helper">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          <span class="hidden xl:inline font-medium">Customize</span>
        </button>
      </div>
    </div>

    <!-- Mobile/Tablet Nav Strip -->
    <nav id="mobileNavStrip" class="lg:hidden border-t border-theme px-3 py-1.5 flex items-center gap-1 overflow-x-auto text-xs">
      <!-- Populated by JS -->
    </nav>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex gap-6 px-3 sm:px-6 py-5">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex flex-col w-60 shrink-0 gap-4">
      <div class="surface border border-theme rounded-2xl p-3 flex flex-col gap-1" id="desktopNav">
        <!-- Populated by JS -->
      </div>

      <!-- Quick Stats Card -->
      <div class="surface border border-theme rounded-2xl p-4 flex flex-col gap-3">
        <div class="text-xs font-semibold uppercase tracking-wider text-muted">At a Glance</div>
        <div id="sidebarStats" class="flex flex-col gap-2 text-sm"></div>
      </div>

      <!-- Courses Quick Filter -->
      <div class="surface border border-theme rounded-2xl p-4 flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-muted">My Courses</span>
          <button id="sidebarAddCourseBtn" type="button" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">+ Add</button>
        </div>
        <div id="sidebarCourses" class="flex flex-col gap-1.5"></div>
      </div>
    </aside>

    <!-- Mobile Drawer Overlay -->
    <div id="mobileDrawer" class="hidden fixed inset-0 z-50 lg:hidden">
      <div id="mobileDrawerBackdrop" class="absolute inset-0 bg-black/40 backdrop-blur-xs"></div>
      <div class="relative w-72 max-w-[85vw] h-full surface border-r border-theme p-4 flex flex-col gap-4 overflow-y-auto">
        <div class="flex items-center justify-between">
          <div class="font-bold text-lg">Helper Menu</div>
          <button id="closeMobileDrawerBtn" type="button" class="p-1.5 rounded-lg subtle">
            <i data-lucide="x" class="w-4 h-4"></i>

        </div>
        <div id="drawerNav" class="flex flex-col gap-1"></div>
        <div class="border-t border-theme pt-3">
          <div class="text-xs font-semibold uppercase tracking-wider text-muted mb-2">Courses</div>
          <div id="drawerCourses" class="flex flex-col gap-1.5"></div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main id="mainContent" class="flex-1 min-w-0 flex flex-col gap-5">
      <!-- Rendered dynamically by JS -->
    </main>
  </div>

  <!-- Reusable Modal -->
  <div id="appModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="appModalBackdrop" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="relative w-full max-w-xl surface border border-theme rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-theme flex items-center justify-between">
        <h3 id="modalTitle" class="font-semibold text-base">Modal</h3>
        <button id="modalCloseBtn" type="button" class="p-1.5 rounded-lg subtle hover:opacity-80">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.courses) return parsed;
          }
        } catch (e) {}
        return getDefaultState();
      }

      let state = loadState();
      let ui = {
        activeView: 'dashboard',
        selectedCourseId: 'all',
        taskCadenceFilter: 'all', // all | daily | weekly
        taskUrgencyFilter: 'all', // all | urgent | non-urgent
        taskStatusFilter: 'active', // all | active | done
        courseSubTab: 'all', // all | syllabus | tutSheets | books | notes
        searchQuery: '',
        searchCategory: 'all',
        selectedDay: getTodayName()
      };

      function getTodayName() {
        const idx = new Date().getDay(); // 0=Sun..6=Sat
        const map = ['Monday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        return map[idx] || 'Monday';
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function uid(prefix) {
        return prefix + '_' + Math.random().toString(36).slice(2, 9);
      }

      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getCourse(courseId) {
        return state.courses.find(c => c.id === courseId) || null;
      }

      function courseBadge(courseId) {
        const c = getCourse(courseId);
        if (!c) return '<span class="px-2 py-0.5 text-[11px] rounded-full subtle text-muted font-medium">General</span>';
        return `<span class="px-2 py-0.5 text-[11px] rounded-full font-medium text-white" style="background-color:${esc(c.color)}">${esc(c.code)}</span>`;
      }

      function applyTheme() {
        const s = state.settings;
        document.documentElement.setAttribute('data-theme', s.theme || 'light');
        const acc = ACCENTS[s.accent] || ACCENTS.indigo;
        const root = document.documentElement.style;
        root.setProperty('--accent', acc.hex);
        root.setProperty('--accent-hover', acc.hover);
        if (s.theme === 'dark' || s.theme === 'slate') {
          root.setProperty('--accent-soft', acc.hex + '29');
          root.setProperty('--accent-text', '#e2e8f0');
        } else {
          root.setProperty('--accent-soft', acc.soft);
          root.setProperty('--accent-text', acc.text);
        }
        document.body.classList.toggle('compact-mode', !!s.compact);
        document.getElementById('appTitleDisplay').textContent = s.appTitle || 'Helper';
        document.getElementById('appSubtitleDisplay').textContent = s.subtitle || '';
        document.title = (s.appTitle || 'Helper') + ' — Personal Hub';
      }

      function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = 'surface border border-theme shadow-lg rounded-xl px-4 py-2.5 text-sm font-medium flex items-center gap-2 pointer-events-auto transition-all';
        el.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0"></i><span>${esc(msg)}</span>`;
        container.appendChild(el);
        if (window.lucide) lucide.createIcons();
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 200);
        }, 2400);
      }

      // Global Search Engine across ALL entities
      function runGlobalSearch(query) {
        const q = (query || '').trim().toLowerCase();
        if (!q) return [];
        const results = [];

        state.tasks.forEach(t => {
          const c = getCourse(t.courseId);
          const hay = `${t.title} ${t.notes} ${t.cadence} ${t.urgency} ${t.due} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'task',
              typeLabel: `${t.cadence === 'daily' ? 'Daily' : 'Weekly'} Task`,
              id: t.id,
              title: t.title,
              subtitle: `${t.urgency === 'urgent' ? 'Urgent' : 'Non-Urgent'} • ${t.due || 'No due date'}${c ? ' • ' + c.code : ''}`,
              done: t.done,
              view: 'tasks'
            });
          }
        });

        state.timetable.forEach(slot => {
          const c = getCourse(slot.courseId);
          const hay = `${slot.day} ${slot.start} ${slot.end} ${slot.type} ${slot.room} ${c ? c.code + ' ' + c.name + ' ' + c.instructor : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'timetable',
              typeLabel: 'Timetable',
              id: slot.id,
              title: `${c ? c.code + ' — ' + c.name : 'Class'} (${slot.type})`,
              subtitle: `${slot.day} • ${slot.start}–${slot.end} • Room ${slot.room || 'TBA'}`,
              view: 'timetable'
            });
          }
        });

        state.notes.forEach(n => {
          const c = getCourse(n.courseId);
          const hay = `${n.title} ${n.content} ${(n.tags || []).join(' ')} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'note',
              typeLabel: 'Note',
              id: n.id,
              title: n.title,
              subtitle: `${c ? c.code + ' • ' : ''}${n.content.slice(0, 75)}${n.content.length > 75 ? '...' : ''}`,
              view: 'notes'
            });
          }
        });

        state.books.forEach(b => {
          const c = getCourse(b.courseId);
          const hay = `${b.title} ${b.author} ${b.edition} ${b.status} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'book',
              typeLabel: 'Book',
              id: b.id,
              title: b.title,
              subtitle: `${b.author}${b.edition ? ' (' + b.edition + ')' : ''}${c ? ' • ' + c.code : ''}`,
              view: 'courses',
              subTab: 'books'
            });
          }
        });

        state.syllabus.forEach(s => {
          const c = getCourse(s.courseId);
          const hay = `${s.unit} ${s.topics} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'syllabus',
              typeLabel: 'Syllabus',
              id: s.id,
              title: s.unit,
              subtitle: `${c ? c.code + ' • ' : ''}${s.topics}`,
              view: 'courses',
              subTab: 'syllabus'
            });
          }
        });

        state.tutSheets.forEach(ts => {
          const c = getCourse(ts.courseId);
          const hay = `${ts.title} ${ts.sheetNo} ${ts.status} ${ts.notes} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'tutSheet',
              typeLabel: 'Tut Sheet',
              id: ts.id,
              title: ts.title,
              subtitle: `${ts.sheetNo} • ${ts.status}${c ? ' • ' + c.code : ''}`,
              view: 'courses',
              subTab: 'tutSheets'
            });
          }
        });

        state.links.forEach(l => {
          const c = getCourse(l.courseId);
          const hay = `${l.title} ${l.category} ${l.description} ${l.url} ${c ? c.code + ' ' + c.name : ''}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'link',
              typeLabel: 'Important Link',
              id: l.id,
              title: l.title,
              subtitle: `${l.category} • ${l.url}`,
              url: l.url,
              view: 'links'
            });
          }
        });

        state.courses.forEach(c => {
          const hay = `${c.code} ${c.name} ${c.instructor}`.toLowerCase();
          if (hay.includes(q)) {
            results.push({
              type: 'course',
              typeLabel: 'Course',
              id: c.id,
              title: `${c.code}: ${c.name}`,
              subtitle: `${c.instructor} • ${c.credits} Credits`,
              view: 'courses'
            });
          }
        });

        return results;
      }

      function renderSearchDropdown() {
        const dd = document.getElementById('searchDropdown');
        const q = ui.searchQuery.trim();
        if (!q || ui.activeView === 'search') {
          dd.classList.add('hidden');
          return;
        }
        const results = runGlobalSearch(q);
        dd.classList.remove('hidden');
        if (results.length === 0) {
          dd.innerHTML = `<div class="p-4 text-center text-sm text-muted">No matches found for "<strong>${esc(q)}</strong>". Try another keyword.</div>`;
          return;
        }
        const top = results.slice(0, 8);
        dd.innerHTML = `
          <div class="px-2.5 py-1.5 flex items-center justify-between text-xs text-muted border-b border-theme mb-1">
            <span>${results.length} result${results.length === 1 ? '' : 's'} found</span>
            <button type="button" data-action="open-search-view" class="font-medium hover:underline" style="color: var(--accent-text)">View all results &rarr;</button>
          </div>
          <div class="flex flex-col gap-1">
            ${top.map(r => `
              <button type="button" data-action="jump-result" data-view="${esc(r.view)}" data-subtab="${esc(r.subTab || '')}" data-id="${esc(r.id)}" data-type="${esc(r.type)}" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-start justify-between gap-3 transition">
                <div class="min-w-0">
                  <div class="text-sm font-medium truncate">${esc(r.title)}</div>
                  <div class="text-xs text-muted truncate">${esc(r.subtitle)}</div>
                </div>
                <span class="shrink-0 px-2 py-0.5 text-[10px] font-semibold rounded-full badge-accent">${esc(r.typeLabel)}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      // Navigation & Sidebar Rendering
      function renderNav() {
        const navHTML = NAV_ITEMS.map(item => {
          const active = ui.activeView === item.id;
          return `
            <button type="button" data-action="nav" data-view="${item.id}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm transition ${active ? 'nav-active' : 'hover:bg-black/5 text-muted hover:text-current'}">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
              <span class="truncate">${esc(item.label)}</span>
            </button>
          `;
        }).join('');

        document.getElementById('desktopNav').innerHTML = navHTML;
        document.getElementById('drawerNav').innerHTML = navHTML;

        document.getElementById('mobileNavStrip').innerHTML = NAV_ITEMS.map(item => {
          const active = ui.activeView === item.id;
          return `
            <button type="button" data-action="nav" data-view="${item.id}" class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg font-medium transition ${active ? 'nav-active' : 'text-muted'}">
              <i data-lucide="${item.icon}" class="w-3.5 h-3.5"></i>
              <span>${esc(item.label)}</span>
            </button>
          `;
        }).join('');

        // Sidebar stats
        const pendingTasks = state.tasks.filter(t => !t.done).length;
        const urgentTasks = state.tasks.filter(t => !t.done && t.urgency === 'urgent').length;
        const pendingTuts = state.tutSheets.filter(ts => ts.status !== 'Completed').length;
        document.getElementById('sidebarStats').innerHTML = `
          <div class="flex items-center justify-between"><span class="text-muted">Pending Tasks</span><span class="font-semibold">${pendingTasks}</span></div>
          <div class="flex items-center justify-between"><span class="text-muted">Urgent Works</span><span class="font-semibold text-rose-500">${urgentTasks}</span></div>
          <div class="flex items-center justify-between"><span class="text-muted">Open Tut Sheets</span><span class="font-semibold">${pendingTuts}</span></div>
          <div class="flex items-center justify-between"><span class="text-muted">Saved Links</span><span class="font-semibold">${state.links.length}</span></div>
        `;

        // Courses list
        const coursesHTML = [
          `<button type="button" data-action="filter-course" data-course="all" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between ${ui.selectedCourseId === 'all' ? 'nav-active' : 'text-muted hover:bg-black/5'}">
            <span>All Courses</span><span>${state.courses.length}</span>
          </button>`,
          ...state.courses.map(c => `
            <button type="button" data-action="filter-course" data-course="${esc(c.id)}" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 ${ui.selectedCourseId === c.id ? 'nav-active' : 'hover:bg-black/5'}">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color:${esc(c.color)}"></span>
              <span class="truncate flex-1">${esc(c.code)} • ${esc(c.name)}</span>
            </button>
          `)
        ].join('');

        document.getElementById('sidebarCourses').innerHTML = coursesHTML;
        document.getElementById('drawerCourses').innerHTML = coursesHTML;
      }

      // Main View Renderer
      function renderMain() {
        const main = document.getElementById('mainContent');
        switch (ui.activeView) {
          case 'dashboard': main.innerHTML = renderDashboard(); break;
          case 'tasks': main.innerHTML = renderTasksView(); break;
          case 'timetable': main.innerHTML = renderTimetableView(); break;
          case 'courses': main.innerHTML = renderCoursesView(); break;
          case 'notes': main.innerHTML = renderNotesView(); break;
          case 'links': main.innerHTML = renderLinksView(); break;
          case 'search': main.innerHTML = renderSearchView(); break;
          default: main.innerHTML = renderDashboard();
        }
        if (window.lucide) lucide.createIcons();
      }

      function renderDashboard() {
        const w = state.settings.widgets;
        const today = getTodayName();
        const todayClasses = state.timetable
          .filter(s => s.day === today)
          .sort((a, b) => a.start.localeCompare(b.start));
        const urgentList = state.tasks.filter(t => !t.done && t.urgency === 'urgent');
        const dailyList = state.tasks.filter(t => t.cadence === 'daily' && !t.done);
        const weeklyList = state.tasks.filter(t => t.cadence === 'weekly' && !t.done);
        const pinnedNotes = state.notes.filter(n => n.pinned);
        const pinnedLinks = state.links.filter(l => l.pinned);

        return `
          <!-- Greeting Banner -->
          <div class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Welcome back, ${esc(state.settings.userName || 'Student')}</h1>
              <p class="text-sm text-muted mt-0.5">Today is ${esc(today)}. You have <strong class="text-rose-500">${urgentList.length} urgent</strong> work${urgentList.length === 1 ? '' : 's'} and <strong>${todayClasses.length}</strong> class${todayClasses.length === 1 ? '' : 'es'} scheduled.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" data-action="open-add" data-kind="task" class="px-3 py-1.5 rounded-xl text-xs font-medium surface border border-theme hover:opacity-80 flex items-center gap-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Task
              </button>
              <button type="button" data-action="open-add" data-kind="note" class="px-3 py-1.5 rounded-xl text-xs font-medium surface border border-theme hover:opacity-80 flex items-center gap-1.5">
                <i data-lucide="notebook-pen" class="w-3.5 h-3.5"></i> New Note
              </button>
              <button type="button" data-action="open-add" data-kind="link" class="px-3 py-1.5 rounded-xl text-xs font-medium surface border border-theme hover:opacity-80 flex items-center gap-1.5">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> Save Link
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 section-gap">
            ${w.schedule ? `
              <section class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 font-semibold"><i data-lucide="calendar-clock" class="w-4 h-4" style="color: var(--accent)"></i> Today's Schedule (${esc(today)})</div>
                  <button type="button" data-action="nav" data-view="timetable" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">Full Timetable</button>
                </div>
                ${todayClasses.length === 0 ? `<div class="text-sm text-muted py-4 text-center">No classes scheduled for ${esc(today)}.</div>` : `
                  <div class="flex flex-col gap-2">
                    ${todayClasses.map(slot => {
                      const c = getCourse(slot.courseId);
                      return `
                        <div class="p-3 rounded-xl subtle flex items-center justify-between gap-3">
                          <div class="flex items-center gap-3 min-w-0">
                            <span class="w-1.5 h-8 rounded-full shrink-0" style="background-color:${c ? esc(c.color) : '#64748b'}"></span>
                            <div class="min-w-0">
                              <div class="text-sm font-semibold truncate">${c ? esc(c.code + ' — ' + c.name) : 'Class'}</div>
                              <div class="text-xs text-muted">${esc(slot.type)} • Room ${esc(slot.room || 'TBA')}</div>
                            </div>
                          </div>
                          <span class="text-xs font-semibold shrink-0 px-2 py-1 rounded-lg surface border border-theme">${esc(slot.start)}–${esc(slot.end)}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </section>
            ` : ''}

            ${w.urgent ? `
              <section class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 font-semibold"><i data-lucide="flame" class="w-4 h-4 text-rose-500"></i> Urgent Works</div>
                  <button type="button" data-action="nav" data-view="tasks" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">All Tasks</button>
                </div>
                ${urgentList.length === 0 ? `<div class="text-sm text-muted py-4 text-center">All urgent works are completed!</div>` : `
                  <div class="flex flex-col gap-2">
                    ${urgentList.slice(0, 5).map(t => renderTaskRowCompact(t)).join('')}
                  </div>
                `}
              </section>
            ` : ''}

            ${w.tasks ? `
              <section class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 font-semibold"><i data-lucide="list-todo" class="w-4 h-4" style="color: var(--accent)"></i> Daily &amp; Weekly Queue</div>
                  <button type="button" data-action="nav" data-view="tasks" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">Manage</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div class="p-3 rounded-xl subtle">
                    <div class="text-muted">Daily Pending</div>
                    <div class="text-xl font-bold mt-0.5">${dailyList.length}</div>
                  </div>
                  <div class="p-3 rounded-xl subtle">
                    <div class="text-muted">Weekly Pending</div>
                    <div class="text-xl font-bold mt-0.5">${weeklyList.length}</div>
                  </div>
                </div>
                <div class="flex flex-col gap-2">
                  ${[...dailyList, ...weeklyList].slice(0, 4).map(t => renderTaskRowCompact(t)).join('') || '<div class="text-sm text-muted text-center py-2">No pending tasks.</div>'}
                </div>
              </section>
            ` : ''}

            ${w.links ? `
              <section class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 font-semibold"><i data-lucide="link" class="w-4 h-4" style="color: var(--accent)"></i> Important Links</div>
                  <button type="button" data-action="nav" data-view="links" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">All Links</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${pinnedLinks.slice(0, 6).map(l => `
                    <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl subtle hover:opacity-85 transition flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <div class="text-xs font-semibold truncate">${esc(l.title)}</div>
                        <div class="text-[11px] text-muted truncate">${esc(l.category)}</div>
                      </div>
                      <i data-lucide="external-link" class="w-3.5 h-3.5 text-muted shrink-0"></i>
                    </a>
                  `).join('')}
                </div>
              </section>
            ` : ''}
          </div>

          ${w.notes ? `
            <section class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 font-semibold"><i data-lucide="pin" class="w-4 h-4" style="color: var(--accent)"></i> Pinned Notes</div>
                <button type="button" data-action="nav" data-view="notes" class="text-xs font-medium hover:underline" style="color: var(--accent-text)">All Notes</button>
              </div>
              ${pinnedNotes.length === 0 ? `<div class="text-sm text-muted">Pin any note to keep it handy here.</div>` : `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  ${pinnedNotes.map(n => `
                    <div class="p-3.5 rounded-xl subtle flex flex-col gap-1.5 cursor-pointer hover:opacity-90" data-action="edit-item" data-kind="note" data-id="${esc(n.id)}">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-sm font-semibold truncate">${esc(n.title)}</span>
                        ${courseBadge(n.courseId)}
                      </div>
                      <p class="text-xs text-muted line-clamp-3 whitespace-pre-line">${esc(n.content)}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </section>
          ` : ''}
        `;
      }

      function renderTaskRowCompact(t) {
        return `
          <div class="p-2.5 rounded-xl subtle flex items-center justify-between gap-2">
            <label class="flex items-center gap-2.5 min-w-0 cursor-pointer flex-1">
              <input type="checkbox" ${t.done ? 'checked' : ''} data-action="toggle-task" data-id="${esc(t.id)}" class="w-4 h-4 rounded accent-indigo-600 shrink-0" />
              <div class="min-w-0">
                <div class="text-sm font-medium truncate ${t.done ? 'line-through text-muted' : ''}">${esc(t.title)}</div>
                <div class="text-[11px] text-muted flex items-center gap-1.5 flex-wrap">
                  <span>${t.cadence === 'daily' ? 'Daily' : 'Weekly'}</span>
                  <span>•</span>
                  <span>${esc(t.due || 'No due date')}</span>
                </div>
              </div>
            </label>
            <div class="flex items-center gap-1.5 shrink-0">
              ${t.urgency === 'urgent' ? '<span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-rose-500/15 text-rose-500">Urgent</span>' : '<span class="px-2 py-0.5 text-[10px] font-medium rounded-full bg-slate-500/15 text-muted">Non-Urgent</span>'}
              ${courseBadge(t.courseId)}
            </div>
          </div>
        `;
      }

      function renderTasksView() {
        const filtered = state.tasks.filter(t => {
          if (ui.selectedCourseId !== 'all' && t.courseId !== ui.selectedCourseId) return false;
          if (ui.taskCadenceFilter !== 'all' && t.cadence !== ui.taskCadenceFilter) return false;
          if (ui.taskUrgencyFilter !== 'all' && t.urgency !== ui.taskUrgencyFilter) return false;
          if (ui.taskStatusFilter === 'active' && t.done) return false;
          if (ui.taskStatusFilter === 'done' && !t.done) return false;
          return true;
        });

        return `
          <div class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-xl font-bold">Tasks &amp; Works</h1>
                <p class="text-xs text-muted">Organize daily &amp; weekly tasks, urgent &amp; non-urgent works.</p>
              </div>
              <button type="button" data-action="open-add" data-kind="task" class="btn-accent px-3.5 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 self-start sm:self-auto">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Task / Work
              </button>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-2 pt-1 border-t border-theme">
              <div class="flex items-center gap-1 p-1 rounded-xl subtle text-xs">
                ${['all', 'daily', 'weekly'].map(c => `
                  <button type="button" data-action="task-filter" data-filter="cadence" data-val="${c}" class="px-2.5 py-1 rounded-lg font-medium capitalize ${ui.taskCadenceFilter === c ? 'surface shadow-xs' : 'text-muted'}">${c}</button>
                `).join('')}
              </div>
              <div class="flex items-center gap-1 p-1 rounded-xl subtle text-xs">
                ${[{v:'all',l:'All Urgency'},{v:'urgent',l:'Urgent'},{v:'non-urgent',l:'Non-Urgent'}].map(u => `
                  <button type="button" data-action="task-filter" data-filter="urgency" data-val="${u.v}" class="px-2.5 py-1 rounded-lg font-medium ${ui.taskUrgencyFilter === u.v ? 'surface shadow-xs' : 'text-muted'}">${u.l}</button>
                `).join('')}
              </div>
              <div class="flex items-center gap-1 p-1 rounded-xl subtle text-xs">
                ${[{v:'active',l:'Pending'},{v:'done',l:'Completed'},{v:'all',l:'All'}].map(s => `
                  <button type="button" data-action="task-filter" data-filter="status" data-val="${s.v}" class="px-2.5 py-1 rounded-lg font-medium ${ui.taskStatusFilter === s.v ? 'surface shadow-xs' : 'text-muted'}">${s.l}</button>
                `).join('')}
              </div>
            </div>

            <!-- List -->
            <div class="flex flex-col gap-2.5">
              ${filtered.length === 0 ? `<div class="py-10 text-center text-sm text-muted">No tasks match your current filters.</div>` : filtered.map(t => `
                <div class="p-3.5 rounded-xl subtle flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <label class="flex items-start gap-3 cursor-pointer flex-1 min-w-0">
                    <input type="checkbox" ${t.done ? 'checked' : ''} data-action="toggle-task" data-id="${esc(t.id)}" class="mt-0.5 w-4 h-4 rounded accent-indigo-600 shrink-0" />
                    <div class="min-w-0">
                      <div class="text-sm font-semibold ${t.done ? 'line-through text-muted' : ''}">${esc(t.title)}</div>
                      ${t.notes ? `<div class="text-xs text-muted mt-0.5">${esc(t.notes)}</div>` : ''}
                      <div class="flex flex-wrap items-center gap-2 mt-1.5 text-[11px] text-muted">
                        <span class="px-2 py-0.5 rounded-full surface border border-theme font-medium">${t.cadence === 'daily' ? 'Daily' : 'Weekly'}</span>

        const cats = [
          { id: 'all', label: 'All' },
          { id: 'task', label: 'Tasks' },
          { id: 'timetable', label: 'Timetable' },
          { id: 'note', label: 'Notes' },
          { id: 'book', label: 'Books' },
          { id: 'syllabus', label: 'Syllabus' },
          { id: 'tutSheet', label: 'Tut Sheets' },
          { id: 'link', label: 'Links' },
          { id: 'course', label: 'Courses' }

        return `
          <div class="surface border border-theme rounded-2xl p-5 card-pad flex flex-col gap-4">
            <div>
              <h1 class="text-xl font-bold">Search Everything</h1>
              <p class="text-xs text-muted">Instant results across tasks, timetable, notes, books, syllabus, tut sheets, courses, and links.</p>
            </div>
            <div class="flex flex-wrap gap-1.5">

              `).join('')}

            ${!q ? `<div class="py-10 text-center text-sm text-muted">Type anything in the search bar above (e.g., "Dijkstra", "Urgent", "Tut Sheet", "Moodle", "Monday").</div>` :

                <div class="flex flex-col gap-2">

      // Event Delegation
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) {
          if (!e.target.closest('#globalSearchInput') && !e.target.closest('#searchDropdown')) {
            document.getElementById('searchDropdown').classList.add('hidden');
          }
          return;
        }
        const action = btn.dataset.action;

        if (action === 'nav') {
          ui.activeView = btn.dataset.view;
          document.getElementById('mobileDrawer').classList.add('hidden');
          document.getElementById('searchDropdown').classList.add('hidden');
          renderNav();
          renderMain();
        } else if (action === 'filter-course') {
          ui.selectedCourseId = btn.dataset.course;
          document.getElementById('mobileDrawer').classList.add('hidden');
          renderNav();
          renderMain();
        } else if (action === 'task-filter') {
          const f = btn.dataset.filter;
          if (f === 'cadence') ui.taskCadenceFilter = btn.dataset.val;
          if (f === 'urgency') ui.taskUrgencyFilter = btn.dataset.val;
          if (f === 'status') ui.taskStatusFilter = btn.dataset.val;
          renderMain();
        } else if (action === 'course-subtab') {
          ui.courseSubTab = btn.dataset.tab;
          renderMain();
        } else if (action === 'search-cat') {
          ui.searchCategory = btn.dataset.cat;
          renderMain();
        } else if (action === 'open-search-view') {
          ui.activeView = 'search';
          document.getElementById('searchDropdown').classList.add('hidden');
          renderNav();
          renderMain();
        } else if (action === 'jump-result') {
          ui.activeView = btn.dataset.view;
          if (btn.dataset.subtab) ui.courseSubTab = btn.dataset.subtab;
          document.getElementById('searchDropdown').classList.add('hidden');
          renderNav();
          renderMain();
        } else if (action === 'open-add') {
          openItemModal(btn.dataset.kind);
        } else if (action === 'edit-item') {
          e.stopPropagation();
          openItemModal(btn.dataset.kind, btn.dataset.id);
        } else if (action === 'delete-item') {
          e.stopPropagation();
          const kind = btn.dataset.kind;
          const id = btn.dataset.id;
          const map = { task: 'tasks', timetable: 'timetable', course: 'courses', syllabus: 'syllabus', tutSheet: 'tutSheets', book: 'books', note: 'notes', link: 'links' };
          state[map[kind]] = state[map[kind]].filter(x => x.id !== id);
          if (kind === 'course' && ui.selectedCourseId === id) ui.selectedCourseId = 'all';
          saveState();
          closeModal();
          renderNav();
          renderMain();
          showToast('Item deleted');
        } else if (action === 'cycle-tut-status') {
          const ts = state.tutSheets.find(x => x.id === btn.dataset.id);
          if (ts) {
            const order = ['Pending', 'In Progress', 'Completed'];
            ts.status = order[(order.indexOf(ts.status) + 1) % order.length];
            saveState();
            renderNav();
            renderMain();
          }
        } else if (action === 'toggle-pin-note') {
          const n = state.notes.find(x => x.id === btn.dataset.id);
          if (n) {
            n.pinned = !n.pinned;
            saveState();
            renderMain();
          }
        } else if (action === 'copy-url') {
          const url = btn.dataset.url;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link copied')).catch(() => fallbackCopy(url));
          } else {
            fallbackCopy(url);
          }
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Link copied'); } catch (e) {}
        ta.remove();
      }

      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset.action === 'toggle-task') {
          const t = state.tasks.find(x => x.id === el.dataset.id);
          if (t) {
            t.done = el.checked;
            saveState();
            renderNav();
            renderMain();
          }
        } else if (el.dataset.action === 'toggle-syllabus') {
          const s = state.syllabus.find(x => x.id === el.dataset.id);
          if (s) {
            s.completed = el.checked;
            saveState();
            renderMain();
          }
        } else if (el.id === 'importDataInput' && el.files && el.files[0]) {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (parsed && parsed.courses && parsed.tasks) {
                state = parsed;
                saveState();
                applyTheme();
                closeModal();
                renderNav();
                renderMain();
                showToast('Data imported successfully');
              }
            } catch (err) {
              showToast('Invalid JSON file');
            }
          };
          reader.readAsText(el.files[0]);
        }
      });

      document.addEventListener('submit', (e) => {
        if (e.target.id === 'itemForm') {
          e.preventDefault();
          const form = e.target;
          const kind = form.dataset.kind;
          const id = form.dataset.id;
          const fd = new FormData(form);
          const data = Object.fromEntries(fd.entries());

          if (kind === 'note') {
            data.pinned = !!form.querySelector('[name="pinned"]').checked;
            data.tags = (data.tags || '').split(',').map(s => s.trim()).filter(Boolean);
            data.updated = new Date().toISOString().slice(0, 10);
          }
          if (kind === 'link') {
            data.pinned = !!form.querySelector('[name="pinned"]').checked;
          }
          if (kind === 'course') {
            data.credits = Number(data.credits) || 3;
          }

          const map = { task: 'tasks', timetable: 'timetable', course: 'courses', syllabus: 'syllabus', tutSheet: 'tutSheets', book: 'books', note: 'notes', link: 'links' };
          const arr = state[map[kind]];
          if (id) {
            const idx = arr.findIndex(x => x.id === id);
            if (idx !== -1) arr[idx] = { ...arr[idx], ...data };
          } else {
            const defaults = kind === 'task' ? { done: false } : kind === 'syllabus' ? { completed: false } : {};
            arr.unshift({ id: uid(kind), ...defaults, ...data });
          }
          saveState();
          closeModal();
          renderNav();
          renderMain();
          showToast(id ? 'Updated successfully' : 'Added to Helper');
        } else if (e.target.id === 'customizeForm') {
          e.preventDefault();
          const form = e.target;
          const fd = new FormData(form);
          state.settings.appTitle = fd.get('appTitle') || 'Helper';
          state.settings.userName = fd.get('userName') || 'Student';
          state.settings.subtitle = fd.get('subtitle') || '';
          state.settings.theme = fd.get('theme') || 'light';
          state.settings.accent = fd.get('accent') || 'indigo';
          state.settings.compact = !!form.querySelector('[name="compact"]').checked;
          ['schedule', 'urgent', 'tasks', 'links', 'notes'].forEach(k => {
            state.settings.widgets[k] = !!form.querySelector(`[name="w_${k}"]`).checked;
          });
          saveState();
          applyTheme();
          closeModal();
          renderNav();
          renderMain();
          showToast('Customization saved');
        }
      });

      document.getElementById('modalBody').addEventListener('click', (e) => {
        if (e.target.id === 'exportDataBtn') {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'helper-backup.json';
          a.click();
          URL.revokeObjectURL(url);
          showToast('Backup exported');
        } else if (e.target.id === 'resetSampleBtn') {
          state = getDefaultState();
          saveState();
          applyTheme();
          closeModal();
          renderNav();
          renderMain();
          showToast('Reset to starter data');
        }
      });

      // Header & Search Listeners
      const searchInput = document.getElementById('globalSearchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      searchInput.addEventListener('input', () => {
        ui.searchQuery = searchInput.value;
        clearSearchBtn.classList.toggle('hidden', !ui.searchQuery);
        if (ui.activeView === 'search') {
          renderMain();
        } else {
          renderSearchDropdown();
        }
      });
      searchInput.addEventListener('focus', () => {
        if (ui.searchQuery.trim() && ui.activeView !== 'search') renderSearchDropdown();
      });
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && ui.searchQuery.trim()) {
          ui.activeView = 'search';
          document.getElementById('searchDropdown').classList.add('hidden');
          renderNav();
          renderMain();
        }
      });
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        ui.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        document.getElementById('searchDropdown').classList.add('hidden');
        if (ui.activeView === 'search') renderMain();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape') {
          closeModal();
          document.getElementById('searchDropdown').classList.add('hidden');
        }
      });

      document.getElementById('brandHomeBtn').addEventListener('click', () => {
        ui.activeView = 'dashboard';
        renderNav();
        renderMain();
      });
      document.getElementById('quickAddBtn').addEventListener('click', () => openItemModal('quick'));
      document.getElementById('customizeBtn').addEventListener('click', openCustomizeModal);
      document.getElementById('sidebarAddCourseBtn').addEventListener('click', () => openItemModal('course'));
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('appModalBackdrop').addEventListener('click', closeModal);
      document.getElementById('mobileMenuBtn').addEventListener('click', () => document.getElementById('mobileDrawer').classList.remove('hidden'));
      document.getElementById('closeMobileDrawerBtn').addEventListener('click', () => document.getElementById('mobileDrawer').classList.add('hidden'));
      document.getElementById('mobileDrawerBackdrop').addEventListener('click', () => document.getElementById('mobileDrawer').classList.add('hidden'));

      // Init
      applyTheme();
      renderNav();
      renderMain();
    })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
